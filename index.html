<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>The Multiverse of 3pack</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b12;--card:#17172a;--ink:#f5f3ff;--dim:#8f8aa8;--a:#ff4fa3;--b:#7c5cff;--c:#35d5ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}

/* HERO */
.hero{position:relative;min-height:92svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(124,92,255,.35);transform:translate(-50%,-50%);pointer-events:none}
.r1{width:78vmin;height:78vmin;animation:rot 40s linear infinite}
.r2{width:112vmin;height:112vmin;border-color:rgba(255,79,163,.22);animation:rot 70s linear infinite reverse}
.ring:before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.r2:before{background:var(--a);box-shadow:0 0 12px var(--a)}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.title{position:relative;margin:0;font-family:'Unbounded',sans-serif;font-weight:800;text-transform:uppercase;line-height:1.05;font-size:clamp(32px,10.5vw,72px)}
.title span{display:block}
.title .main{background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite,pop 1s both}
.ghost{position:absolute;inset:0;color:transparent;-webkit-text-stroke:1px;pointer-events:none}
.g1{-webkit-text-stroke-color:rgba(53,213,255,.5);animation:g1 5s ease-in-out infinite}
.g2{-webkit-text-stroke-color:rgba(255,79,163,.5);animation:g2 5s ease-in-out infinite}
@keyframes g1{0%,100%{transform:translate(0)}50%{transform:translate(-7px,-4px)}}
@keyframes g2{0%,100%{transform:translate(0)}50%{transform:translate(7px,4px)}}
@keyframes flow{to{background-position:300% 0}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.names{position:relative;display:flex;gap:10px;align-items:center;margin:26px 0 0;color:var(--dim);font-size:15px;letter-spacing:.04em;animation:pop 1s .4s both}
.names i{width:4px;height:4px;border-radius:50%;background:var(--b)}
.scroll{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--dim);letter-spacing:.12em}
.scroll:after{content:"";display:block;width:1px;height:30px;margin:8px auto 0;background:linear-gradient(var(--c),transparent);animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(6px);opacity:.4}}

/* UNIVERSES */
main{max-width:480px;margin:0 auto;padding:0 18px 40px}
.uni{margin:0 0 20px;padding-bottom:36px}
.frame{position:relative;width:100%;aspect-ratio:4/5;margin:0 auto;border-radius:20px;overflow:hidden;background:var(--card);z-index:2;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 24px 50px -24px rgba(124,92,255,.6)}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.tag{position:absolute;left:12px;top:12px;z-index:2;font-size:12px;padding:5px 11px;border-radius:99px;background:rgba(11,11,18,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15)}
.tag:before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}

/* player slides down from behind the picture (driven by scroll) */
.dock{position:relative;z-index:1;margin:-24px 10px 0;padding-top:24px;overflow:hidden;border-radius:0 0 30px 30px;
height:calc(var(--p,0)*104px);opacity:var(--p,0);will-change:height,opacity}
.player{display:flex;align-items:center;gap:14px;width:100%;height:92px;margin-top:calc((1 - var(--p,0))*-80px);padding:12px 16px 12px 12px;border:0;border-radius:0 0 30px 30px;background:var(--card);color:inherit;font:inherit;text-align:left;cursor:pointer;position:relative;overflow:hidden;will-change:margin-top}
.player:focus-visible{outline:2px solid var(--c);outline-offset:-2px}
.vinyl{flex:none;display:block;position:relative;width:64px;height:64px;min-width:64px;aspect-ratio:1/1;border-radius:50%;overflow:hidden;isolation:isolate;clip-path:circle(50% at 50% 50%);background:#0a0a0f;animation:spin 3s linear infinite;animation-play-state:paused;transform:translateZ(0);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.player .vinyl>img{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;margin:0;border-radius:50%;object-fit:cover;display:block}
.vinyl:before{content:"";position:absolute;inset:0;z-index:1;border-radius:50%;background:repeating-radial-gradient(circle,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.28) 3px 4px),conic-gradient(from 20deg,transparent,rgba(255,255,255,.22),transparent 25%,transparent 50%,rgba(255,255,255,.22),transparent 75%)}
.vinyl:after{content:"";position:absolute;left:50%;top:50%;z-index:2;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--card);box-shadow:0 0 0 2px rgba(0,0,0,.45)}
@keyframes spin{to{transform:rotate(360deg)}}
.playing .vinyl{animation-play-state:running}
.meta{flex:1;min-width:0}
.meta strong{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:var(--dim);font-size:13px}
.btn{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center}
.btn svg{width:14px;height:14px;fill:#fff}
.p2{display:none}.playing .p1{display:none}.playing .p2{display:block}
.player.off{opacity:.55;cursor:default}
.bar{position:absolute;left:0;bottom:0;height:3px;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--a),var(--c))}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.dock{--p:1!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="ring r1"></div><div class="ring r2"></div>
  <h1 class="title" aria-label="The Multiverse of 3pack">
    <span class="ghost g1" aria-hidden="true"><span>The Multiverse</span><span>of 3pack</span></span>
    <span class="ghost g2" aria-hidden="true"><span>The Multiverse</span><span>of 3pack</span></span>
    <span class="main"><span>The Multiverse</span><span>of 3pack</span></span>
  </h1>
  <p class="names"><span>Suhaib</span><i></i><span>Ariyen</span><i></i><span>Hassan</span></p>
  <div class="scroll">SCROLL</div>
</header>

<main id="list"></main>

<script>
/* ===== EDIT HERE =====
 Pictures AND covers all live in  images/  (name.jpg)
 All mp3 files live in            music/   (name.mp3)
 Just write the file name WITHOUT .jpg / .mp3
   title = small tag on the picture      photo = picture name
   cover = vinyl cover name (empty = plain default vinyl)
   music = mp3 name (empty = no player under that picture)
   song / artist = optional text on the player (default: the title)
 The pictures show in this order. Move a line to move a picture. */
const UNIVERSES = [
  { title:"AOT", photo:"AOT", cover:"AOTcover", music:"AOTmusic" },
  { title:"Iraq", photo:"Iraq", music:"" },
  { title:"Fortnite", photo:"Fortnite", cover:"Fornitecover", music:"Fortnitemusic" },
  { title:"Minecraft", photo:"minecraft", cover:"minecraftcover", music:"Minecraftmusic" },
  { title:"Fotball2", photo:"fotball2", cover:"fotballcover2", music:"fotball2music" },
  { title:"Heist", photo:"Heist", music:"" },
  { title:"Walkingdead", photo:"walkingdead", cover:"walkingdeadcover", music:"" },
  { title:"Barbie", photo:"barbie", cover:"barbiecover", music:"barbiemusic" },
  { title:"Rich", photo:"rich", cover:"richcover", music:"" },
  { title:"Clashroyale", photo:"clashroyale", cover:"clashroyalecover", music:"clashroyalemusic" },
  { title:"Kingvon", photo:"kingvon", cover:"kingvoncover", music:"" },
  { title:"Carchase", photo:"carchase", music:"" },
  { title:"Squidgame", photo:"squidgame", cover:"squidgamecover", music:"squidgamemusic" },
  { title:"Tyskland", photo:"Tyskland", cover:"Tysklandcover", music:"Tysklandmusic" },
  { title:"Ninjago", photo:"ninjago", cover:"ninjagocover", music:"ninjagomusic" },
  { title:"Dino", photo:"dino", cover:"dinocover", music:"dinomusic" },
  { title:"Egypt", photo:"egypt", cover:"egyptcover", music:"egyptmusic" },
  { title:"Jurrassic", photo:"jurrassic", cover:"jurrassiccover", music:"" },
  { title:"Avatar", photo:"avatar", cover:"avatarcover", music:"" },
  { title:"Titanic", photo:"titanic", cover:"titaniccover", music:"titanicmusic" },
  { title:"Beyblade", photo:"beyblade", cover:"beybladecover", music:"" },
  { title:"Oddparents", photo:"oddparents", cover:"oddparentscover", music:"" },
  { title:"Gumball", photo:"gumball", cover:"gumballcover", music:"" },
  { title:"Ben 10", photo:"ben10", cover:"ben10cover", music:"" },
  { title:"Powerpuff", photo:"powerpuff", cover:"powerpuffcover", music:"" },
  { title:"Bakugan", photo:"bakugan", cover:"bakugancover", music:"" },
  { title:"Homeless", photo:"homeless", cover:"homelesscover", music:"" },
  { title:"Scobydo", photo:"scobydo", cover:"scobydocover", music:"" },
  { title:"Mulitverse", photo:"mulitverse", cover:"mulitversecover", music:"" },
  { title:"Tomandjerry", photo:"tomandjerry", cover:"tomandjerrycover", music:"" },
  { title:"Ghostbuster", photo:"ghostbuster", cover:"ghostbustercover", music:"" },
  { title:"Samandcat", photo:"samandcat", cover:"samandcatcover", music:"" },
  { title:"Victorius", photo:"victorius", cover:"victoriuscover", music:"" },
  { title:"Avatarlastairbender", photo:"avatarlastairbender", cover:"avatarlastairbendercover", music:"" },
  { title:"Bigtimerush", photo:"bigtimerush", cover:"bigtimerushcover", music:"bigtimerushmusic" },
  { title:"Turtles", photo:"turtles", cover:"turtlescover", music:"" },
  { title:"Cars", photo:"cars", cover:"carscover", music:"" },
  { title:"Gravityfalls", photo:"gravityfalls", cover:"gravityfallscover", music:"gravityfallsmusic" },
  { title:"Adventure Time", photo:"adventure time", cover:"adventure timecover", music:"" },
  { title:"Phines And Ferb", photo:"phines and ferb", cover:"phines an ferb cover", music:"" },
  { title:"Steven Universe", photo:"steven universe", cover:"steven universe cover", music:"" },
  { title:"Regularshow", photo:"regularshow", cover:"regularshow cover", music:"" },
  { title:"Rickandmorty", photo:"rickandmorty", cover:"rickandmortycover", music:"" },
  { title:"Dragonball", photo:"dragonball", cover:"dragonballcover", music:"" },
  { title:"Cuphead", photo:"cuphead", cover:"cupheadcover", music:"" },
  { title:"Spongebob", photo:"spongebob", cover:"spongebobcover", music:"" },
  { title:"Familyguy", photo:"familyguy", cover:"familyguycover", music:"" },
  { title:"Simpson", photo:"simpson", cover:"simpsoncover", music:"" },
  { title:"Game Of Thrones", photo:"game of thrones", cover:"game of thronescover", music:"" },
  { title:"Mission Ipmossible", photo:"mission ipmossible", cover:"mission ipmossible cover", music:"" },
  { title:"Zelda", photo:"Zelda", cover:"Zelda cover", music:"" },
  { title:"Kim", photo:"kim", cover:"kim cover", music:"" },
  { title:"Angry Birds", photo:"angry birds", cover:"angry birds cover", music:"" },
  { title:"Samurai", photo:"samurai", cover:"samuraicover", music:"" },
  { title:"Harukamirai", photo:"harukamirai", cover:"harukamiraicover", music:"" },
  { title:"Naruto", photo:"naruto", cover:"narutocover", music:"" },
  { title:"PUBG", photo:"pubg", cover:"pubgcover", music:"" },
  { title:"Peace", photo:"peace", cover:"peace cover", music:"peacemusic" },
  { title:"Story", photo:"story", cover:"storycover", music:"" },
  { title:"AOT 2", photo:"aot2", cover:"aot2cover", music:"" },
  { title:"Henrydanger", photo:"henrydanger", cover:"henrydangercover", music:"" },
  { title:"Pinkphanter", photo:"pinkphanter", cover:"pinkphantercover", music:"" },
  { title:"Sauen", photo:"sauen", cover:"sauencover", music:"" },
  { title:"Frozen", photo:"frozen", cover:"frozencover", music:"" },
  { title:"Oggy", photo:"oggy", cover:"oggycover", music:"" },
  { title:"Zig And Sharko", photo:"zig and sharko", cover:"zig and sharko cover", music:"" },
  { title:"Lionking", photo:"lionking", cover:"lionkingcover", music:"" },
  { title:"Powerrangers", photo:"powerrangers", cover:"powerrangerscover", music:"" },
  { title:"Stranger Things", photo:"stranger things", cover:"stranger things cover", music:"" },
  { title:"Home Alone", photo:"home alone", cover:"home alone cover", music:"" },
  { title:"Zootopia", photo:"zootopia", cover:"zootopiacover", music:"" },
  { title:"Sleep", photo:"sleep", cover:"sleep cover", music:"" },
  { title:"Good Morning", photo:"good morning", cover:"good morning cover", music:"good-morningmusic" },
  { title:"Breakfast", photo:"breakfast", cover:"breakfast cover", music:"breakfastmusic" },
  { title:"Bonus 1", photo:"nocover1" },
  { title:"Bonus 2", photo:"nocover2" },
  { title:"Bonus 3", photo:"nocover3" },
  { title:"Bonus 4", photo:"nocover4" },
  { title:"Bonus 5", photo:"nocover5" },
  { title:"Bonus 6", photo:"NORSKE" },
  { title:"Bonus 7", photo:"DOC" },
  { title:"Bonus 8", photo:"SKII" },
  { title:"Bonus 9", photo:"F1" },
  { title:"Bonus 10", photo:"NBA" },
  { title:"Bonus 11", photo:"GOLF" }
];

const IMG="images/",COV="images/",MUS="music/",EXT=".jpg";
const cols=[["#ff4fa3","#7c5cff"],["#35d5ff","#7c5cff"],["#ffb347","#ff4fa3"]];
function art(i){const [a,b]=cols[i%3];
  return "data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 50'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs><rect width='40' height='50' fill='url(#g)' opacity='.6'/></svg>`)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), ease=t=>t*t*(3-2*t);

const audio=new Audio(); audio.preload="none"; let current=null;
const list=document.getElementById("list"), docks=[];

UNIVERSES.forEach((u,i)=>{
  const song=u.song||u.title, hasMusic="music" in u, playable=!!u.music;
  const el=document.createElement("section"); el.className="uni";
  el.innerHTML=`<div class="frame"><img alt="${esc(u.title)}" decoding="async"><span class="tag">${esc(u.title)}</span></div>`+(hasMusic?
  `<div class="dock"><button class="player${playable?"":" off"}" aria-label="Play ${esc(song)}">
    <span class="vinyl"><img alt="" loading="lazy"></span>
    <span class="meta"><strong>${esc(song)}</strong><small>${playable?esc(u.artist||""):"Not added yet"}</small></span>
    <span class="btn"><svg class="p1" viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg><svg class="p2" viewBox="0 0 16 16"><path d="M3 1h4v14H3zM9 1h4v14H9z"/></svg></span>
    <span class="bar"></span>
  </button></div>`:"");
  const pic=el.querySelector(".frame>img"), frame=el.querySelector(".frame");
  pic.onload=()=>{ /* frame fits the whole picture, no cropping */
    const r=clamp(pic.naturalWidth/pic.naturalHeight||.8,.45,2);
    frame.style.aspectRatio=r; el.style.maxWidth=`calc(78svh * ${r})`; el.style.marginInline="auto"; update();
  };
  pic.onerror=()=>{pic.onerror=null;pic.src=art(i)};
  if(i>0) pic.loading="lazy";
  pic.src=IMG+u.photo+EXT;
  if(hasMusic){
    const cov=el.querySelector(".vinyl img");
    cov.onerror=()=>{cov.onerror=null;cov.src=art(i)};
    cov.src=u.cover?COV+u.cover+EXT:art(i);
    const btn=el.querySelector(".player"), sub=btn.querySelector("small"), bar=btn.querySelector(".bar");
    btn._bar=bar;
    btn.onclick=()=>{
      if(!playable)return;
      if(current===btn){audio.paused?audio.play().catch(()=>{}):audio.pause();return}
      if(current){current.classList.remove("playing");current._bar.style.transform="scaleX(0)"}
      current=btn; audio.src=MUS+u.music+".mp3"; audio.play().catch(()=>{sub.textContent="Couldn't load the mp3"});
    };
    docks.push({frame,dock:el.querySelector(".dock")});
  }
  list.appendChild(el);
});
["play","pause","ended"].forEach(e=>audio.addEventListener(e,()=>current&&current.classList.toggle("playing",!audio.paused&&!audio.ended)));
audio.addEventListener("timeupdate",()=>{if(current&&audio.duration)current._bar.style.transform=`scaleX(${audio.currentTime/audio.duration})`});

/* scroll-driven slide: player drops out from under the picture near the
   middle of the screen and tucks back up as it leaves */
let tick=false;
function update(){
  tick=false; const vh=innerHeight;
  docks.forEach(d=>{
    const r=d.frame.getBoundingClientRect();
    if(r.bottom<-vh||r.top>2*vh){d.dock.style.setProperty("--p",0);return}
    const c=(r.top+r.bottom)/2/vh;
    d.dock.style.setProperty("--p",ease(Math.min(clamp((0.92-c)/0.3),clamp((c+0.05)/0.3))).toFixed(3));
  });
}
addEventListener("scroll",()=>{if(!tick){tick=true;requestAnimationFrame(update)}},{passive:true});
addEventListener("resize",update); update();
</script>
</body>
</html>
